<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yumshoq — musiqa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2eaff;--bg2:#ffe2ee;--tx:#2a2240;--tx2:#6d6488;--glass:rgba(255,255,255,.42);--gb:rgba(255,255,255,.75);--sh:rgba(90,60,150,.3);--hl:rgba(255,255,255,.95);--card:#f7f1ff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f26;--bg2:#2b1235;--tx:#f6f0ff;--tx2:#aaa0c8;--glass:rgba(255,255,255,.08);--gb:rgba(255,255,255,.22);--sh:rgba(0,0,0,.6);--hl:rgba(255,255,255,.07);--card:#241a3d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f26;--bg2:#2b1235;--tx:#f6f0ff;--tx2:#aaa0c8;--glass:rgba(255,255,255,.08);--gb:rgba(255,255,255,.22);--sh:rgba(0,0,0,.6);--hl:rgba(255,255,255,.07);--card:#241a3d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;color:var(--tx);font:500 16px/1.4 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fredoka,"DM Sans",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid hsl(262 90% 65%);outline-offset:2px}
.blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blobs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 26s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:hsl(262 90% 70%);left:-12vmax;top:-10vmax}
.blobs i:nth-child(2){background:hsl(330 90% 72%);right:-14vmax;top:20vh;animation-delay:-9s}
.blobs i:nth-child(3){background:hsl(195 90% 68%);left:20vw;bottom:-22vmax;animation-delay:-17s}
@keyframes fl{to{transform:translate(6vmax,5vmax) scale(1.15)}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--gb);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),0 14px 36px rgba(20,10,50,.22)}
.clay{background:linear-gradient(145deg,hsl(var(--h) 88% 74%),hsl(calc(var(--h) + 38) 82% 60%));box-shadow:8px 12px 24px var(--sh),-5px -5px 14px var(--hl),inset 5px 5px 10px rgba(255,255,255,.5),inset -7px -9px 16px rgba(0,0,0,.17)}
.cover{aspect-ratio:1;border-radius:28%;display:grid;place-items:center;font-size:2.2rem;flex:none}
.cover.sm{width:52px;font-size:1.5rem;border-radius:18px;box-shadow:4px 6px 12px var(--sh),-3px -3px 8px var(--hl),inset 3px 3px 6px rgba(255,255,255,.5),inset -4px -5px 9px rgba(0,0,0,.17)}
.cover.md{width:46px;font-size:1.3rem;border-radius:16px;box-shadow:3px 5px 10px var(--sh),inset 3px 3px 6px rgba(255,255,255,.5),inset -4px -4px 8px rgba(0,0,0,.17)}
svg{width:1em;height:1em;fill:currentColor;display:block}
.app{position:relative;z-index:1;display:grid;grid-template-columns:230px 1fr;gap:16px;padding:16px}
.side{position:sticky;top:16px;align-self:start;border-radius:32px;padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 16px;font:700 1.4rem Fredoka,sans-serif}
.logo .cover{width:42px;font-size:1.3rem;border-radius:14px}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;font-weight:700;color:var(--tx2);text-align:left;transition:background .2s,color .2s}
.nav svg{font-size:1.3rem}
.nav.on{color:var(--tx);background:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px rgba(20,10,50,.15)}
main{min-width:0;padding:6px 6px 190px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top h1{font-size:clamp(1.7rem,4vw,2.4rem)}
.gbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem}
.view{display:none}.view.on{display:block}
.hero{display:flex;gap:22px;align-items:center;padding:22px;border-radius:36px;margin-bottom:26px;flex-wrap:wrap}
.hero .cover{width:min(190px,42vw);font-size:4rem}
.hero h2{font-size:clamp(1.5rem,4vw,2.2rem)}
.hero p{margin:4px 0 16px;color:var(--tx2)}
.pbtn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;color:#fff;--h:262}
.pbtn:active,.cbtn:active{transform:scale(.94)}
h3{font-size:1.25rem;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;margin-bottom:26px}
.card{padding:14px;border-radius:30px;text-align:left;display:block;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card .cover{width:100%;font-size:3rem;margin-bottom:12px}
.card b,.row b{display:block;font-weight:700}
.card small,.row small{color:var(--tx2)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;border-radius:26px;cursor:pointer}
.row .meta{flex:1;min-width:0}
.row b,.row small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur b{color:hsl(var(--h) 80% 50%)}
.hrt{font-size:1.4rem;padding:8px;color:var(--tx2)}
.hrt.on{color:#ff4f8b}
.search{width:100%;border-radius:22px;padding:16px 20px;font:inherit;color:var(--tx);margin-bottom:18px}
.search::placeholder{color:var(--tx2)}
.empty{color:var(--tx2);padding:26px;text-align:center;border-radius:26px}
.mini{position:fixed;z-index:20;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));border-radius:28px;padding:10px 14px 14px 10px;display:none;align-items:center;gap:12px;cursor:pointer;overflow:hidden}
.mini.on{display:flex}
.mini .meta{flex:1;min-width:0}
.mini b,.mini small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{color:var(--tx2)}
.cbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;color:#fff;flex:none}
.bar{position:absolute;left:18px;right:18px;bottom:6px;height:4px;border-radius:4px;background:rgba(127,127,160,.3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:hsl(var(--h) 90% 65%)}
.tabs{position:fixed;z-index:20;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));border-radius:30px;padding:8px;display:none;justify-content:space-around}
.tabs .nav{flex-direction:column;gap:2px;padding:8px 18px;font-size:.75rem}
.np{position:fixed;inset:0;z-index:50;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.9,.25,1);display:grid;gap:14px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(165deg,hsl(var(--h) 60% 22%),hsl(calc(var(--h) + 50) 55% 12%));color:#fff;grid-template-columns:1fr;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;grid-template-areas:"x" "c" "tt" "ly" "sk" "ct";overflow:hidden}
.np.on{transform:none}
.np::before{content:"";position:absolute;width:70vmax;height:70vmax;left:-20vmax;top:-25vmax;background:hsl(var(--h) 90% 60%);filter:blur(90px);opacity:.35;border-radius:50%}
.np>*{position:relative}
.np .x{grid-area:x;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;justify-self:start;color:#fff}
.np .cover{grid-area:c;width:min(150px,34vh);justify-self:center;font-size:3.4rem}
.np .tt{grid-area:tt;text-align:center}
.np h2{font-size:1.5rem}.np .tt p{margin:2px 0 0;opacity:.7}
.ly{grid-area:ly;overflow-y:auto;border-radius:30px;padding:28px 22px;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);color:#fff}
.ly::-webkit-scrollbar{display:none}
.ly p{margin:0 0 20px;font:700 clamp(1.5rem,5.5vw,2.4rem)/1.2 Fredoka,sans-serif;opacity:.32;filter:blur(1.4px);transform:scale(.88);transform-origin:left center;transition:all .5s;cursor:pointer}
.ly p.on{opacity:1;filter:none;transform:none;text-shadow:0 0 28px hsl(var(--h) 100% 75%/.55)}
.ly .pad{height:30vh}
.sk{grid-area:sk}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:14px;background:rgba(255,255,255,.2);box-shadow:inset 2px 3px 6px rgba(0,0,0,.35);outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(145deg,#fff,hsl(var(--h) 80% 80%));box-shadow:3px 4px 8px rgba(0,0,0,.4),inset -2px -3px 5px rgba(0,0,0,.15)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:linear-gradient(145deg,#fff,hsl(var(--h) 80% 80%));box-shadow:3px 4px 8px rgba(0,0,0,.4)}
.times{display:flex;justify-content:space-between;font-size:.85rem;opacity:.7;margin-top:6px}
.ct{grid-area:ct;display:flex;justify-content:center;align-items:center;gap:22px}
.ct .cbtn{background:rgba(255,255,255,.14);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 8px 20px rgba(0,0,0,.3)}
.ct .pbtn{width:78px;height:78px;font-size:2.2rem}
.ct .hrt{color:#fff;opacity:.8}.ct .hrt.on{color:#ff6fa0;opacity:1}
@media (max-width:820px){.app{grid-template-columns:1fr;padding:12px}.side{display:none}.tabs{display:flex}}
@media (min-width:821px){
.mini{left:262px;bottom:16px}
.np{grid-template-columns:minmax(300px,400px) 1fr;column-gap:44px;grid-template-rows:auto auto auto auto;align-content:center;grid-template-areas:"c ly" "tt ly" "sk ly" "ct ly";padding:40px 56px}
.np .x{position:absolute;left:24px;top:calc(22px + env(safe-area-inset-top,0px))}
.np .cover{width:min(340px,40vh);font-size:6rem}
.ly{height:min(78vh,720px)}
.main-pad{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.addbox{padding:16px;border-radius:30px;margin-bottom:24px}
.addbox .r{display:flex;gap:10px}
.addbox .search{margin:0;flex:1;min-width:0}
.addbox small{display:block;color:var(--tx2);margin-top:10px}
.btn{padding:14px 20px;border-radius:20px;font-weight:700;color:#fff;--h:262;flex:none;background:linear-gradient(145deg,hsl(var(--h) 88% 74%),hsl(calc(var(--h) + 38) 82% 60%));box-shadow:4px 6px 14px var(--sh),inset 3px 3px 6px rgba(255,255,255,.5),inset -4px -5px 9px rgba(0,0,0,.17)}
.btn:disabled{opacity:.5}
.btn.ghost{background:rgba(127,127,160,.2);box-shadow:none;color:var(--tx)}
.row .hrt svg{width:1em;height:1em}
.slot{grid-area:c;justify-self:center;width:min(100%,300px);aspect-ratio:16/9;border-radius:18px}
.np .edb{grid-area:x;justify-self:end;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;color:#fff}
#pw{position:fixed;z-index:30;display:none;background:#000;border-radius:18px;overflow:hidden;box-shadow:0 14px 36px rgba(20,10,50,.4);transition:left .3s,top .3s,width .3s,height .3s}
#pw iframe{width:100%;height:100%;border:0;display:block}
.ly.plain p{opacity:.92;filter:none;transform:none;font-size:clamp(1.1rem,4.5vw,1.5rem);cursor:default;margin-bottom:12px}
.ly .msg{padding:20px;text-align:center;opacity:.9;font:600 1.1rem/1.6 "DM Sans",sans-serif}
.ly .msg .btn{margin-top:14px}
.ed{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(10,5,25,.6)}
.ed[hidden]{display:none}
.edc{width:min(100%,520px);max-height:92vh;overflow:auto;padding:20px;border-radius:28px;background:var(--card);color:var(--tx)}
.edc label{display:block;font-weight:700;font-size:.9rem;color:var(--tx2)}
.fld{display:block;width:100%;border:1px solid var(--gb);background:rgba(127,127,160,.12);color:var(--tx);border-radius:14px;padding:12px 14px;font:inherit;margin:6px 0 14px;resize:vertical}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
#est{display:block;margin:10px 0 14px;color:var(--tx2);font-size:.9rem}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;z-index:100;padding:12px 18px;border-radius:20px;pointer-events:none;transition:.3s;max-width:90vw;text-align:center;background:var(--card);color:var(--tx);box-shadow:0 10px 30px rgba(20,10,50,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:821px){.slot{width:min(100%,400px)}.np .edb{position:absolute;grid-area:auto;right:24px;top:calc(22px + env(safe-area-inset-top,0px))}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app">
  <aside class="side glass">
    <div class="logo"><div class="cover clay" style="--h:262">🫧</div>Yumshoq</div>
    <button class="nav on" data-v="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Bosh sahifa</button>
    <button class="nav" data-v="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>Qidiruv</button>
    <button class="nav" data-v="lib"><svg viewBox="0 0 24 24"><path d="M5 4h3v16H5zM10 4h3v16h-3zM15.5 5l3-.8 3.7 15.2-3 .8z"/></svg>Kutubxona</button>
  </aside>
  <main>
    <header class="top"><h1 id="hi">Salom</h1><button class="gbtn glass" id="th" aria-label="Yorug’ yoki qorong’i rejim">◐</button></header>
    <section class="view on" id="v-home">
      <div class="addbox glass">
        <div class="r"><input class="search glass" id="url" type="text" inputmode="url" placeholder="YouTube havolasini yopishtiring" aria-label="YouTube havolasi"><button class="btn" id="addb">Qo’shish</button></div>
        <small>Qo’shiq nomi va ijrochisi bo’yicha sinxron lyrics avtomatik qidiriladi.</small>
      </div>
      <h3>Playlist</h3>
      <div class="grid" id="grid"></div>
    </section>
    <section class="view" id="v-search">
      <input class="search glass" id="q" type="search" placeholder="Qo’shiq yoki ijrochi nomi" aria-label="Qidiruv">
      <div class="list" id="res"></div>
    </section>
    <section class="view" id="v-lib">
      <h3>Saqlanganlar</h3>
      <div class="list" id="liked"></div>
    </section>
  </main>
</div>

<div class="mini glass" id="mini" role="button" tabindex="0" aria-label="Pleyerni ochish">
  <div class="cover md clay" id="mc"></div>
  <div class="meta"><b id="mt"></b><small id="ma"></small></div>
  <button class="cbtn clay" id="mp" aria-label="Ijro / pauza" style="--h:262"></button>
  <div class="bar"><i id="mb"></i></div>
</div>

<nav class="tabs glass" aria-label="Asosiy">
  <button class="nav on" data-v="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Bosh</button>
  <button class="nav" data-v="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>Qidiruv</button>
  <button class="nav" data-v="lib"><svg viewBox="0 0 24 24"><path d="M5 4h3v16H5zM10 4h3v16h-3zM15.5 5l3-.8 3.7 15.2-3 .8z"/></svg>Kutubxona</button>
</nav>

<section class="np" id="np" aria-label="Hozir ijro etilmoqda">
  <button class="x" id="close" aria-label="Yopish"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="edb" id="edb" aria-label="Lyrics va nomni tahrirlash">✎</button>
  <div class="slot" id="slot"></div>
  <div class="tt"><h2 id="bt"></h2><p id="ba"></p></div>
  <div class="ly glass" id="ly" aria-live="off"></div>
  <div class="sk"><input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Vaqt"><div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div></div>
  <div class="ct">
    <button class="hrt" id="bh" aria-label="Saqlash"></button>
    <button class="cbtn" id="pv" aria-label="Oldingi"></button>
    <button class="pbtn clay" id="bp" aria-label="Ijro / pauza"></button>
    <button class="cbtn" id="nx" aria-label="Keyingi"></button>
  </div>
</section>

<div id="pw"><div id="ytp"></div></div>

<div class="ed" id="ed" hidden>
  <div class="edc">
    <h3>Nom va lyrics</h3>
    <label for="et">Qo’shiq nomi</label><input class="fld" id="et">
    <label for="ea">Ijrochi</label><input class="fld" id="ea">
    <button class="btn" id="efind">Avtomatik qidirish</button>
    <span id="est"></span>
    <label for="el">Matn (LRC yoki oddiy matn)</label>
    <textarea class="fld" id="el" rows="8" placeholder="[00:12.00] Birinchi qator&#10;[00:18.50] Ikkinchi qator"></textarea>
    <div class="acts"><button class="btn ghost" id="ecancel">Bekor</button><button class="btn" id="esave">Saqlash</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const IC={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',prev:'<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg>',next:'<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg>',heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9C1 8.5 3 5 6.5 5c2 0 3.5 1 5.5 3 2-2 3.5-3 5.5-3C21 5 23 8.5 21.3 12 19 16.4 12 21 12 21z"/></svg>',trash:'<svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 12H7z"/></svg>'};
const $=id=>document.getElementById(id),root=document.documentElement;
const KEY='yumshoq.v2';
let tracks=[],liked=new Set(),cur=-1,pos=0,dur=0,playing=false,act=-1,dragging=false,lp=null;
let yt=null,ytReady=false,pend=null;const busy=new Set();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const hue=id=>{let x=0;for(const c of id)x=(x*31+c.charCodeAt(0))%360;return x};
const thumb=t=>`https://i.ytimg.com/vi/${t.id}/mqdefault.jpg`;
const grad=h=>`linear-gradient(145deg,hsl(${h} 88% 74%),hsl(${h+38} 82% 60%))`;
const covStyle=t=>`--h:${t.h};background-image:url(${thumb(t)}),${grad(t.h)};background-size:cover;background-position:center`;
const cov=(t,c)=>`<div class="cover ${c} clay" style="${covStyle(t)}"></div>`;
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3500)}

/* ---------- saqlash (brauzer xotirasi) ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify({tracks,liked:[...liked]}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){tracks=d.tracks||[];liked=new Set(d.liked||[])}}catch(e){}}

/* ---------- havola va nomni tahlil qilish ---------- */
function vid(s){s=s.trim();const m=s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);if(m)return m[1];return /^[\w-]{11}$/.test(s)?s:null}
function guess(title,author){
 let s=title.replace(/[\(\[][^\)\]]*[\)\]]/g,' ').replace(/\b(official|music video|lyric video|lyrics?|video|audio|hd|4k|mv|clip)\b/gi,' ').replace(/\s*[|｜].*$/,'').replace(/\s+/g,' ').trim();
 let a=(author||'').replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/i,'').trim(),t=s||title;
 const m=s.split(/\s+[-–—]\s+/);
 if(m.length>=2){a=m[0].trim();t=m.slice(1).join(' - ').trim()}
 return{t,a}}

/* ---------- LRCLIB ---------- */
async function findLy(t,a,d){
 const B='https://lrclib.net/api/',q=o=>new URLSearchParams(o);
 const clean=t.replace(/\s*[\(\[]?\s*(feat\.?|ft\.?|prod\.?).*$/i,'').trim()||t;
 const j=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()};
 let list=[];
 try{list=await j(B+'search?'+q(a?{track_name:clean,artist_name:a}:{track_name:clean}))}catch(e){}
 if(!list.length){try{list=await j(B+'search?'+q({q:(a+' '+clean).trim()}))}catch(e){}}
 list=list.filter(x=>x.syncedLyrics||x.plainLyrics);
 if(!list.length)return null;
 if(d){const near=list.filter(x=>Math.abs(x.duration-d)<=3);if(near.length)list=near}
 list.sort((x,y)=>(!!y.syncedLyrics-!!x.syncedLyrics)||(d?Math.abs(x.duration-d)-Math.abs(y.duration-d):0));
 return list[0].syncedLyrics||list[0].plainLyrics}
function parse(raw){
 if(!raw||!raw.trim())return null;
 const out=[],plain=[];let synced=false;
 raw.split(/\r?\n/).forEach(line=>{
  const re=/\[(\d+):(\d+(?:[.:]\d+)?)\]/g;let m;const ts=[];
  while((m=re.exec(line)))ts.push(+m[1]*60+parseFloat(m[2].replace(':','.')));
  const txt=line.replace(/\[[^\]]*\]/g,'').trim();
  if(ts.length){synced=true;if(txt)ts.forEach(s=>out.push([s,txt]))}else if(txt)plain.push(txt)});
 if(synced)return{synced:true,L:out.sort((a,b)=>a[0]-b[0])};
 return plain.length?{synced:false,L:plain.map(x=>[0,x])}:null}
async function fetchLy(t){
 if(busy.has(t.id))return;busy.add(t.id);if(tracks[cur]===t)paintLy();
 let r=null;try{r=await findLy(t.t,t.a,tracks[cur]===t?dur:0)}catch(e){}
 busy.delete(t.id);
 if(r){t.lrc=r;t.ls='ok'}else if(!t.lrc)t.ls='none';
 save();if(tracks[cur]===t)paintLy()}

/* ---------- YouTube pleyer ---------- */
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('ytp',{width:'100%',height:'100%',playerVars:{playsinline:1,rel:0,controls:0,modestbranding:1,fs:0,disablekb:1},events:{
 onReady:()=>{ytReady=true;if(pend){yt.loadVideoById(pend);pend=null}},
 onStateChange:e=>{const s=e.data;if(s===1)playing=true;else if(s===2||s===0)playing=false;icons();if(s===0&&tracks.length>1)go(1)},
 onError:()=>{playing=false;icons();toast('Bu videoni bu yerda ijro etib bo’lmaydi (egasi taqiqlagan). Boshqasini tanlang.')}}})};
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
setInterval(()=>{if(!ytReady||cur<0)return;try{pos=yt.getCurrentTime()||0;const d=yt.getDuration();if(d)dur=d}catch(e){}ui()},250);

function place(){const w=$('pw');if(cur<0){w.style.display='none';return}w.style.display='block';
 let l,t,W,H;
 if($('np').classList.contains('on')){const r=$('slot').getBoundingClientRect();l=r.left;t=r.top;W=r.width;H=r.height;w.style.zIndex=60}
 else{W=Math.min(200,innerWidth-32);H=W*9/16;const m=$('mini').getBoundingClientRect();l=innerWidth-W-16;t=m.top-H-10;w.style.zIndex=30}
 Object.assign(w.style,{left:l+'px',top:t+'px',width:W+'px',height:H+'px'})}
addEventListener('resize',place);
$('np').addEventListener('transitionend',e=>{if(e.propertyName==='transform')place()});

function load(i){cur=i;pos=0;dur=0;playing=false;const t=tracks[i];paint();place();
 if(ytReady)yt.loadVideoById(t.id);else pend=t.id;
 if(!t.lrc&&!t.ls&&!busy.has(t.id))fetchLy(t)}
function toggle(){if(cur<0){if(tracks.length)load(0);return}if(!ytReady)return;playing?yt.pauseVideo():yt.playVideo()}
function go(d){if(tracks.length)load((cur+d+tracks.length)%tracks.length)}

/* ---------- interfeys ---------- */
function ui(){
 const d=dur||0;$('mb').style.width=(d?pos/d*100:0)+'%';
 if(!dragging){$('seek').max=d||1;$('seek').value=pos;$('tc').textContent=fmt(pos)}
 $('td').textContent=fmt(d);
 if(lp&&lp.synced){let a=-1;lp.L.forEach((l,i)=>{if(pos>=l[0])a=i});
  if(a!==act){act=a;const ps=$('ly').querySelectorAll('p');ps.forEach((p,i)=>p.classList.toggle('on',i===a));
   if(a>=0){const p=ps[a],c=$('ly');c.scrollTo({top:p.offsetTop-c.clientHeight/2+p.clientHeight/2,behavior:'smooth'})}}}}
function icons(){const ic=playing?IC.pause:IC.play;$('mp').innerHTML=ic;$('bp').innerHTML=ic;$('pv').innerHTML=IC.prev;$('nx').innerHTML=IC.next;heart()}
function heart(){const t=tracks[cur];$('bh').innerHTML=IC.heart;$('bh').classList.toggle('on',!!t&&liked.has(t.id))}
function paintLy(){
 const t=tracks[cur],c=$('ly');act=-1;lp=parse(t.lrc);
 c.classList.toggle('plain',!!lp&&!lp.synced);
 if(lp)c.innerHTML=lp.L.map(l=>`<p data-t="${lp.synced?l[0]:''}">${esc(l[1])}</p>`).join('')+'<div class="pad"></div>';
 else if(busy.has(t.id))c.innerHTML='<div class="msg">Lyrics qidirilmoqda…</div>';
 else c.innerHTML='<div class="msg">Lyrics topilmadi.<br><button class="btn" id="manual">Qo’lda kiritish</button></div>';
 c.scrollTop=0;ui()}
function paint(){const t=tracks[cur];['mini','np'].forEach(k=>$(k).style.setProperty('--h',t.h));$('mini').classList.add('on');
 const mc=$('mc');mc.style.cssText=covStyle(t);
 $('mt').textContent=$('bt').textContent=t.t||'Nomsiz';$('ma').textContent=$('ba').textContent=t.a||'—';
 $('mp').style.setProperty('--h',t.h);$('bp').style.setProperty('--h',t.h);
 document.querySelectorAll('.row').forEach(r=>r.classList.toggle('cur',+r.dataset.i===cur));
 paintLy();icons()}

const row=i=>{const t=tracks[i];return `<div class="row glass${i===cur?' cur':''}" data-i="${i}" style="--h:${t.h}" tabindex="0">${cov(t,'sm')}<div class="meta"><b>${esc(t.t)}</b><small>${esc(t.a||'Ijrochi yo’q')}</small></div><button class="hrt${liked.has(t.id)?' on':''}" data-like="${t.id}" aria-label="Saqlash">${IC.heart}</button><button class="hrt" data-del="${i}" aria-label="O’chirish">${IC.trash}</button></div>`};
function lists(){
 const q=$('q').value.trim().toLowerCase(),all=tracks.map((t,i)=>i);
 $('grid').innerHTML=all.length?all.map(i=>{const t=tracks[i];return `<button class="card glass" data-i="${i}" style="--h:${t.h}">${cov(t,'')}<b>${esc(t.t)}</b><small>${esc(t.a||'')}</small></button>`}).join(''):'<div class="empty glass" style="grid-column:1/-1">Playlist bo’sh. Yuqoriga YouTube havolasini yopishtiring.</div>';
 const r=all.filter(i=>(tracks[i].t+' '+tracks[i].a).toLowerCase().includes(q));
 $('res').innerHTML=r.length?r.map(row).join(''):'<div class="empty glass">Hech narsa topilmadi.</div>';
 const l=all.filter(i=>liked.has(tracks[i].id));
 $('liked').innerHTML=l.length?l.map(row).join(''):'<div class="empty glass">Hali hech narsa yo’q. Qo’shiqdagi yurakchani bosing, u shu yerda paydo bo’ladi.</div>'}

/* ---------- qo’shish va o’chirish ---------- */
async function add(){
 const inp=$('url'),id=vid(inp.value);
 if(!id){toast('Havola noto’g’ri. YouTube havolasini yopishtiring.');return}
 const ex=tracks.findIndex(t=>t.id===id);if(ex>=0){inp.value='';load(ex);return}
 $('addb').disabled=true;let title='',author='';
 try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));if(r.ok){const j=await r.json();title=j.title;author=j.author_name}}catch(e){}
 const g=title?guess(title,author):{t:'Nomsiz qo’shiq',a:''};
 const t={id,t:g.t,a:g.a,h:hue(id),lrc:'',ls:''};
 tracks.push(t);save();inp.value='';$('addb').disabled=false;lists();
 toast(title?'Qo’shildi. Lyrics qidirilmoqda…':'Nom topilmadi. Pleyerdagi ✎ orqali o’zingiz yozing.');
 if(title)fetchLy(t)}
function del(i){const t=tracks[i];tracks.splice(i,1);liked.delete(t.id);
 if(i===cur){cur=-1;playing=false;if(ytReady)yt.stopVideo();$('mini').classList.remove('on');$('np').classList.remove('on')}else if(i<cur)cur--;
 save();place();lists();icons()}

/* ---------- lyrics tahrirlash ---------- */
function openEd(){if(cur<0)return;const t=tracks[cur];$('et').value=t.t;$('ea').value=t.a;$('el').value=t.lrc||'';$('est').textContent='';$('ed').hidden=false}
$('edb').onclick=openEd;$('ecancel').onclick=()=>$('ed').hidden=true;
$('efind').onclick=async()=>{const st=$('est');st.textContent='Qidirilmoqda…';let r=null;try{r=await findLy($('et').value.trim(),$('ea').value.trim(),dur)}catch(e){}
 if(r){$('el').value=r;st.textContent='Topildi. «Saqlash»ni bosing.'}else st.textContent='Topilmadi. Nom va ijrochini tekshiring yoki matnni o’zingiz kiriting.'};
$('esave').onclick=()=>{const t=tracks[cur];t.t=$('et').value.trim()||t.t;t.a=$('ea').value.trim();t.lrc=$('el').value;t.ls=t.lrc.trim()?'ok':'none';save();paint();lists();$('ed').hidden=true};

/* ---------- hodisalar ---------- */
const h=new Date().getHours();$('hi').textContent=h<5?'Xayrli tun':h<12?'Xayrli tong':h<18?'Xayrli kun':'Xayrli kech';
document.addEventListener('click',e=>{
 if(e.target.closest('#manual')){openEd();return}
 const dl=e.target.closest('[data-del]');if(dl){e.stopPropagation();del(+dl.dataset.del);return}
 const lk=e.target.closest('[data-like]');if(lk){e.stopPropagation();const id=lk.dataset.like;liked.has(id)?liked.delete(id):liked.add(id);save();lists();heart();return}
 const r=e.target.closest('[data-i]');if(r&&!r.classList.contains('nav')){const i=+r.dataset.i;i===cur?toggle():load(i);return}
 const n=e.target.closest('.nav');if(n){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.v===n.dataset.v));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+n.dataset.v));lists()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.row,.mini'))e.target.click()});
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
$('addb').onclick=add;
$('q').oninput=lists;
$('mp').onclick=e=>{e.stopPropagation();toggle()};
$('mini').onclick=()=>{if(cur>=0)$('np').classList.add('on')};
$('close').onclick=()=>{$('np').classList.remove('on');place()};
$('bp').onclick=toggle;$('pv').onclick=()=>go(-1);$('nx').onclick=()=>go(1);
$('bh').onclick=()=>{const t=tracks[cur];if(!t)return;liked.has(t.id)?liked.delete(t.id):liked.add(t.id);save();lists();heart()};
const sk=$('seek');sk.addEventListener('pointerdown',()=>dragging=true);
['pointerup','pointercancel'].forEach(v=>sk.addEventListener(v,()=>dragging=false));
sk.oninput=e=>{pos=+e.target.value;$('tc').textContent=fmt(pos);act=-1;ui()};
sk.onchange=e=>{dragging=false;if(ytReady)yt.seekTo(+e.target.value,true)};
$('ly').onclick=e=>{const p=e.target.closest('p');if(p&&p.dataset.t!==''&&ytReady){pos=+p.dataset.t;yt.seekTo(pos,true);act=-1;ui()}};
$('th').onclick=()=>{const d=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;root.dataset.theme=d?'light':'dark'};
restore();lists();
</script>
